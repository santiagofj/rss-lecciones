name: Prueba aislada de Groq y Tavily

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - name: Probar generación, búsqueda y feeds en la copia de Actions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { copyFile, mkdir, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { saveCourseExtension } from "./src/courses/extensions.ts";
          import { validateRepository } from "./src/courses/validate-repository.ts";
          import { GroqClient } from "./src/generation/groq.ts";
          import { generateWithGroq } from "./src/generation/lesson-draft.ts";
          import { buildLessonPrompt } from "./src/generation/prompt.ts";
          import { localCalendarDate } from "./src/generation/schedule.ts";
          import { writePreparedLesson } from "./src/generation/write-lesson.ts";
          import { generateCourseExtension } from "./src/planning/continue-card-games.ts";
          import { buildPublicSite } from "./src/publishing/site.ts";

          const groqKey = process.env.GROQ_API_KEY?.trim();
          const tavilyKey = process.env.TAVILY_API_KEY?.trim();
          assert.ok(groqKey && tavilyKey, "Faltan secretos de los proveedores");
          const root = process.cwd();
          const initial = await validateRepository(root);
          assert.ok(initial.ok, JSON.stringify(initial.issues));
          const { repository } = initial;
          const client = new GroqClient(groqKey, repository.site.generation);
          const preview = path.join(root, "provider-preview");
          await mkdir(preview, { recursive: true });
          const getCourse = (slug) => {
            const course = repository.courses.find((item) => item.config.slug === slug);
            assert.ok(course, slug);
            return course;
          };

          const publishedAt = new Date();
          const samples = [["audio-digital", "guided"], ["historia-filosofia", "expository"]];
          const files = [];
          for (const [slug, lessonFormat] of samples) {
            const course = getCourse(slug);
            const step = course.syllabus.frontmatter.steps.find(({ id }) => id === course.progress.cursor.nextStepId);
            assert.ok(step, slug);
            console.log(`Probando ${slug}: ${step.title}`);
            const prompt = buildLessonPrompt({ course, step, recentLessons: course.lessons.slice(-3) });
            const draft = await generateWithGroq({ client, prompt, lessonFormat });
            const filename = await writePreparedLesson(repository.site, {
              course, draft, prompt: draft.promptUsed ?? prompt,
              generationDate: localCalendarDate(publishedAt, course.config.timezone),
              publishedAt: publishedAt.toISOString(),
              extraRequestId: process.env.GITHUB_RUN_ID,
            });
            files.push({ slug, filename, stepId: step.id, lessonFormat });
            await copyFile(path.join(course.directory, "lessons", filename), path.join(preview, `${slug}.md`));
            console.log(`Lección ${lessonFormat} validada: ${draft.markdown.split(/\s+/u).length} palabras`);
          }

          console.log("Probando ampliación de Naipes con fuentes de Tavily");
          const cardGames = getCourse("juegos-naipes");
          const extension = await generateCourseExtension({ course: cardGames, client, tavilyApiKey: tavilyKey });
          await saveCourseExtension(root, cardGames, extension);
          await writeFile(path.join(preview, "naipes.json"), JSON.stringify(extension, null, 2));
          console.log(`Ampliación validada: ${extension.steps.length} juego(s) y ${extension.research.sources.length} fuente(s)`);

          const result = await validateRepository(root);
          assert.ok(result.ok, JSON.stringify(result.issues));
          await buildPublicSite(root, result.repository);
          for (const { slug, filename, lessonFormat } of files) {
            const basename = filename.replace(/\.md$/u, ".html");
            const feed = await readFile(path.join(root, "public", slug, "feed.xml"), "utf8");
            assert.ok(feed.includes(basename), slug);
            const page = await readFile(path.join(root, "public", slug, basename), "utf8");
            assert.equal((page.match(/<h2>/gu) ?? []).length, lessonFormat === "guided" ? 5 : 3, slug);
          }
          console.log("RSS y HTML verificados en la copia temporal.");
          JS
      - name: Guardar muestras de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-tavily-muestras
          path: provider-preview/*
          if-no-files-found: ignore
          retention-days: 2
