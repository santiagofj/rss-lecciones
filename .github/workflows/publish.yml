name: Generar y publicar lecciones

on:
  schedule:
    # GitHub interpreta cron en UTC. 03:00 UTC = 00:00 en Buenos Aires.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: lecciones-diarias
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Validar configuración inicial
        run: npm run validate

      - name: Generar lecciones y sitio
        run: npm run generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verificar resultado
        run: |
          npm run validate
          npm run typecheck
          npm test

      - name: Guardar el avance del curso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses
          if git diff --cached --quiet; then
            echo "No hay una lección nueva para guardar"
          else
            git commit -m "content: publicar lecciones diarias"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
