teaching:
  audience: Desarrollador de nivel inicial-intermedio que aprende mejor con ejemplos concretos.
  instructions: "Enfoque conceptual independiente de un stack. Explicar primero el problema, después responsabilidades y flujo, y finalmente un ejemplo mínimo explicado. Usar diagramas textuales, tablas de datos, trazas HTTP, HTML/CSS, SQL o pseudocódigo según corresponda; definir todo identificador no evidente. No exigir instalar herramientas, contratar servicios ni construir una aplicación para seguir el curso. El caso de notas compartidas sirve como hilo conductor: cada lección debe incluir los datos y contratos que requiere, sin depender de código de lecciones no disponibles. La práctica debe pedir predecir, explicar, comparar o diagnosticar y aportar una forma concreta de comprobar la respuesta. Recuperar las primeras lecciones de autorización y consistencia cuando sean pertinentes, sin atribuir conocimientos dominados. Introducir prerrequisitos antes de utilizarlos. En las integraciones conectar las capas y considerar un caso de fallo. No inventar APIs ni parámetros actuales de seguridad."
