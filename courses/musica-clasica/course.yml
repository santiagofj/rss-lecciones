teaching:
  audience: Oyente que comienza desde cero y quiere aprender a reconocer lo que escucha.
  instructions: "Usar lenguaje accesible, elegante y sobrio. Cada término debe surgir de algo que primero pueda escucharse y describirse. No exigir partitura, instrumento ni teoría previa no explicada. Identificar compositor, obra y movimiento o sección de cada escucha; usar los ejemplos del paso actual y no inventar grabaciones, disponibilidad, enlaces ni marcas temporales. Ofrecer un recorrido por señales musicales localizables y permitir distribuir obras largas en varias sesiones. Distinguir observación audible, contexto documentado, interpretación y preferencia. Integrar compositoras y diversidad de tradiciones en sus contextos, evitando una historia de progreso lineal o una única lectura correcta. Recuperar conceptos anteriores mediante una pregunta de escucha concreta, sin asumir que el alumno realizó tareas previas. En las integraciones construir un mapa o comparación razonada con criterios de comprobación auditivos."
