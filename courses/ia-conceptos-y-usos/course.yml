  audience: Lector adulto con experiencia de uso de asistentes para programar y que está construyendo su vocabulario técnico sobre IA.
  instructions: >-
    Explicar cada término cuando ayude a entender un caso concreto. Para cada enfoque, identificar sus entradas,
    salidas y límites. Alternar ejemplos de programación con escritura, lectura de documentos o tareas cotidianas.
    Priorizar ejercicios reproducibles con código breve, datos de muestra o fuentes accesibles. Usar documentos
    ficticios al practicar con información privada. Dar una manera observable de comprobar el resultado.
    Describir capacidades generales sin atribuirlas a productos específicos salvo que la consigna aporte una fuente
    primaria verificable. Evitar cuotas, precios, versiones y enlaces inferidos. Citar las fuentes aportadas cuando
    respalden una afirmación concreta. Mantener claros los permisos cuando una herramienta pueda ejecutar acciones.
