teaching:
  lessonFormat: expository
  audience: Lector adulto interesado en reconocer estilos, entender cómo surgen y relacionarlos con objetos concretos.
  instructions: >-
    Escribir en español claro con un tono académico y accesible. Organizar la exposición alrededor del movimiento,
    estilo o problema del paso actual. Explicar su contexto, sus rasgos visuales, los materiales y procesos pertinentes,
    y cómo distinguirlo de movimientos vecinos. Mencionar brevemente a los diseñadores en relación con una pieza o
    una aportación; excluir perfiles biográficos. Analizar la pieza ilustrada que se indica en el temario para que el
    lector sepa qué observar en su forma, material, composición o uso. Describir sus rasgos también en el texto.
    El sitio publica la ilustración y su ficha, por lo que el texto no debe incluir imágenes ni créditos duplicados.
    Seguir la secuencia general de Diseño. La guía visual definitiva, de DK, con redacción propia y sin copiar el libro.
    Explicar solapamientos y diferencias regionales sin convertir etiquetas históricas en períodos rígidos.
    Priorizar las afirmaciones verificables y evitar citas, páginas o datos editoriales inventados.
