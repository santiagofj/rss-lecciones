teaching:
  audience: Usuario con experiencia práctica inicial en reproducción digital.
  instructions: "Mantener un tono técnico, profesional y preciso. Introducir un concepto por vez desde un problema observable, con matemática sólo cuando aporte comprensión. Conservar el enfoque práctico con Roon y foobar2000, explicando funciones sin inventar menús de una versión. Ofrecer datos de ejemplo o alternativas sin instrumental ni compras. Distinguir datos, mediciones, hipótesis y audibilidad. Usar el objetivo y la práctica del paso actual; recuperar conceptos anteriores sólo cuando sean necesarios, sin atribuir dominio ni ejercicios realizados al alumno. En cada integración, conectar los conceptos del módulo con los anteriores. No presentar bit-perfect, mayor resolución o un formato como garantía de mejor sonido."
