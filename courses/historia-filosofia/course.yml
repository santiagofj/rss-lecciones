teaching:
  audience: Lector adulto con familiaridad panorámica desde Platón hasta Nietzsche, sin presuponer dominio de argumentos ni terminología.
  instructions: Mantener un tono académico, serio, sobrio y claro. Reconstruir los argumentos antes de evaluarlos; definir los términos técnicos; distinguir exposición, interpretación y crítica; evitar anacronismos y relatos simplistas de progreso. Identificar las obras primarias relevantes sin inventar citas, páginas ni referencias. Incluir desacuerdos interpretativos cuando sean importantes.
